<script>

        extend: {

              DEFAULT: '#05944F',
              hover: '#048043',
              subtle: '#E8F5ED',
            },
            surface: {

              border: '#E8E8E8',
              hover: '#EFEFEF'
            },
            dark: '#000000',
            muted: '#545454',
            lightmuted: '#8A8A8A'

          fontFamily: {

<style>
    @layer base {
      html, body {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        color: #000000;
        -webkit-font-smoothing: antialiased;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 16px);
      }
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-surface font-sans text-dark flex flex-col min-h-screen">
<!-- Uber-style Minimal Top App Bar -->

<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Brand Pill -->

<div class="w-10 flex justify-end">

<span class="material-symbols-outlined text-[19px]">help_outline</span>
</button>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col pt-20 pb-safe px-5 max-w-md mx-auto w-full">
<!-- Title & Subtitle Section -->
<div class="mt-4 mb-6">
<h1 class="text-[28px] font-bold tracking-tight text-dark leading-tight">
        Verify phone number
      </h1>
<div class="flex items-center gap-1.5 mt-2 flex-wrap text-[15px] leading-relaxed">
<span class="text-muted">Enter the 6-digit code sent to</span>
<span class="font-semibold text-dark tracking-wide">+91 7771834791</span>
<button class="text-brand font-semibold hover:underline text-[14px] ml-0.5">Change</button>
</div>
</div>
<!-- Demo Fast Pass Banner -->
<div class="w-full bg-brand-subtle/80 border border-brand/20 rounded-xl px-3.5 py-2.5 mb-7 flex items-center justify-between gap-3">
<div class="flex items-center gap-2 min-w-0">
<span class="material-symbols-outlined text-brand text-[20px] shrink-0" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
<p class="text-xs text-dark font-medium leading-snug truncate">
          Demo Code: <span class="font-bold tracking-wider underline cursor-pointer" id="demo-code">440099</span>
</p>
</div>
<button class="text-xs font-semibold text-brand hover:underline shrink-0" id="fill-demo-btn" type="button">
        Auto Fill
      </button>
</div>
<!-- Segmented 6-Box OTP Inputs -->
<div class="mb-5">
<div class="flex items-center justify-between gap-2.5 sm:gap-3" id="otp-container">
<input class="otp-cell w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border border-surface-border focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition-all border-brand bg-white" data-index="0" inputmode="numeric" maxlength="1" type="tel" value="4">
<input class="otp-cell w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border border-surface-border focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition-all border-brand bg-white" data-index="1" inputmode="numeric" maxlength="1" type="tel" value="4">
<input class="otp-cell w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border border-surface-border focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition-all border-brand bg-white" data-index="2" inputmode="numeric" maxlength="1" type="tel" value="0">
<input class="otp-cell w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border border-surface-border focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition-all border-brand bg-white" data-index="3" inputmode="numeric" maxlength="1" type="tel" value="0">
<input class="otp-cell w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border border-surface-border focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition-all border-brand bg-white" data-index="4" inputmode="numeric" maxlength="1" type="tel" value="9">
<input class="otp-cell w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-bold rounded-xl border border-surface-border focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 focus:outline-none transition-all border-brand bg-white" data-index="5" inputmode="numeric" maxlength="1" type="tel" value="9">
</div>
<!-- Resend Status Row -->
<div class="flex items-center justify-between mt-4 px-1 text-[13px]">
<span class="text-muted">Didn't receive code?</span>
<div class="flex items-center gap-1 font-medium" id="resend-wrapper">
              <button id="resend-action" type="button" class="text-brand font-semibold hover:underline flex items-center gap-1">
                <span class="">Resend Code</span>
              </button>
            </div>
</div>
</div>
<!-- Primary Action Button -->
<div class="mt-3 mb-6">
<button class="w-full h-13 py-3.5 px-4 bg-brand hover:bg-brand-hover active:scale-[0.99] text-white rounded-xl font-semibold text-[16px] flex items-center justify-center gap-2 shadow-sm transition-all duration-150" id="verify-btn" type="button">
<span class="">Verify &amp; Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Divider -->

<!-- Alternative Sign-in Methods -->

<!-- Security & Privacy Reassurance -->

<!-- Operating Details Footer -->
<footer class="mt-auto pt-8 pb-3 text-center">
<div class="flex items-center justify-center gap-1.5 text-xs text-lightmuted font-medium mb-1">
<span class="material-symbols-outlined text-[14px]">bedtime</span>
<span class="">Indore Late-Night Service • 7:00 PM – 4:00 AM</span>
</div>
<p class="text-[11px] text-lightmuted">
        NiteOwl Technologies Pvt Ltd • Bhawarkua, Indore
      </p>
</footer>
</main>
<script>
    (function initUberOTP() {
      const inputs = Array.from(document.querySelectorAll('.otp-cell'));
      const verifyBtn = document.getElementById('verify-btn');
      const timerDisplay = document.getElementById('countdown-timer');
      const resendWrapper = document.getElementById('resend-wrapper');
      const demoCode = document.getElementById('demo-code');
      const fillDemoBtn = document.getElementById('fill-demo-btn');
      const quickDemoBtn = document.getElementById('quick-demo-btn');

      // Sync input focus & movement
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/[^0-9]/g, '');
          input.value = val ? val[val.length - 1] : '';
          
          if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
          highlightInputs();
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
          if (pasted) {
            inputs.forEach((inp, i) => {
              inp.value = pasted[i] || '';
            });
            highlightInputs();
            const lastFilled = Math.min(pasted.length, inputs.length) - 1;
            if (lastFilled >= 0 && lastFilled < inputs.length) {
              inputs[lastFilled].focus();
            }
          }
        });
      });

      function highlightInputs() {
        inputs.forEach(input => {
          if (input.value) {
            input.classList.add('border-brand', 'bg-white');
            input.classList.remove('bg-surface-subtle');
          } else {
            input.classList.remove('border-brand');
            input.classList.add('bg-surface-subtle');
          }
        });
      }
      highlightInputs();

      function fillOTP(code) {
        const digits = code.split('');
        inputs.forEach((inp, idx) => {
          inp.value = digits[idx] || '';
        });
        highlightInputs();
      }

      if (demoCode) {
        demoCode.addEventListener('click', () => fillOTP('440099'));
      }
      if (fillDemoBtn) {
        fillDemoBtn.addEventListener('click', () => fillOTP('440099'));
      }

      if (quickDemoBtn) {
        quickDemoBtn.addEventListener('click', () => {
          fillOTP('440099');
          triggerVerification();
        });
      }

      // Countdown logic
      let seconds = 48;
      function startTimer() {
        const interval = setInterval(() => {
          seconds--;
          if (seconds <= 0) {
            clearInterval(interval);
            resendWrapper.innerHTML = `
              <button id="resend-action" type="button" class="text-brand font-semibold hover:underline flex items-center gap-1">
                <span>Resend Code</span>
              </button>
            `;
            const resendAction = document.getElementById('resend-action');
            if (resendAction) {
              resendAction.addEventListener('click', () => {
                seconds = 48;
                resendWrapper.innerHTML = `
                  <span class="text-muted">Resend code in</span>
                  <span class="text-dark font-semibold tabular-nums" id="countdown-timer">${seconds}s</span>
                `;
                startTimer();
              });
            }
          } else {
            const timerEl = document.getElementById('countdown-timer');
            if (timerEl) timerEl.textContent = seconds + 's';
          }
        }, 1000);
      }
      startTimer();

      function triggerVerification() {
        if (!verifyBtn) return;
        verifyBtn.innerHTML = `
          <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
          <span>Verifying...</span>
        `;
        verifyBtn.disabled = true;

        setTimeout(() => {
          verifyBtn.innerHTML = `
            <span class="material-symbols-outlined text-[20px]">check_circle</span>
            <span>Success! Opening Menu...</span>
          `;
          verifyBtn.classList.remove('bg-brand');
          verifyBtn.classList.add('bg-brand-hover');
        }, 700);
      }

      if (verifyBtn) {
        verifyBtn.addEventListener('click', triggerVerification);
      }
    })();
  </script>


</body></html>
