<script>
  (function initSplashMicroInteractions() {
    const loginBtn = document.getElementById('login-btn');
    const guestBtn = document.getElementById('guest-btn');

    if (loginBtn) {
      loginBtn.addEventListener('click', function() {
        const originalText = this.innerHTML;
        this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Connecting OTP...';
        this.classList.add('opacity-90');
        setTimeout(() => {
          this.innerHTML = originalText;
          this.classList.remove('opacity-90');
        }, 1200);
      });
    }

      guestBtn.addEventListener('click', function() {
        this.classList.add('translate-x-1');
        setTimeout(() => this.classList.remove('translate-x-1'), 200);
      });
    }
  })();
